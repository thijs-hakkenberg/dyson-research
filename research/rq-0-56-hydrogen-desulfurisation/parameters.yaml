# Simulator parameters for rq-0-56 checked against the literature
# Compiled: 2026-11-12. Companion to papers.yaml and analysis.md.
# assumed   = the range smelting_sim.py uses now (PHYSICS_RANGES)
# supported = what the sources support, or null where they support nothing
# basis     = measured | extrapolated | analogue | not-found | not-assessed
# Entries with key beginning "new_" are quantities the simulator does not currently carry.

parameters:

  # ---------------- Priority 1: the hydrogen step ----------------

  - key: tau_h2_h
    assumed: [2, 40]
    supported: null
    conditions: "wanted: 100 um troilite, 900 C, flowing H2"
    basis: not-found
    sources: ["10.1016/0022-4596(87)90146-0", "10.1515/amm-2015-0245", "10.1252/jcej.14.389"]
    note: >
      No measured desulfurisation rate for FeS in H2 between 700 and 950 C was obtained.
      Eleven query families were run across OpenAlex (free text, and restricted to Metallurgical
      and Materials Transactions B, Metallurgical Transactions B, ISIJ International, Canadian
      Metallurgical Quarterly, Minerals Engineering, JOM and Journal of Sustainable Metallurgy),
      plus arXiv and NTRS. Exactly one indexed paper has this as its stated subject, Wiltowski
      et al. 1987, and it is closed through every open-access route; its numbers are therefore
      not used. The nearest measured analogues are NiS in H2 at 723-873 K, linear kinetics with
      Ea = 103 kJ/mol, and the reverse reaction on iron (see new_reverse_rate). Neither fixes
      tau_h2_h. The decision thresholds in the brief - 14 h, 22 h, 40 h - cannot be ranked
      against evidence, so the simulator's pass rates for the hydrogen route are currently
      carried entirely by an unsourced assumption.

  - key: new_dG_FeS_H2
    assumed: "dG = 59960 - 3.2*T  J/mol  (FeS + H2 = Fe + H2S)"
    supported: "dG = 66388 - 10.34*T  J/mol over 873-1173 K"
    conditions: "equilibrium with solid Fe and solid FeS, 873/973/1073/1173 K"
    basis: measured
    sources: ["10.2355/isijinternational.44.250"]
    note: >
      Iguchi and Itoh Table 2 tabulates (pH2S/pH2)e in equilibrium with Fe and FeS as
      3.70e-4 at 873 K, 9.47e-4 at 973 K, 2.03e-3 at 1073 K and 3.84e-3 at 1173 K, taken from
      Knacke, Kubaschewski and Hesselmann, Thermochemical Properties of Inorganic Substances,
      2nd ed., Springer 1991 - a named standard compilation, as the brief asked for. Converting
      to free energy and fitting a straight line gives the supported expression. The simulator's
      expression reproduces K to within a factor 1.03 at 873 K and 0.82 at 1173 K, i.e. it is
      slightly conservative at the process temperature. Replace it only if the extra 18 percent
      of driving force matters; the assumed form is adequate. Not checked: whether nickel in the
      sulfide or dissolved in the metal shifts the equilibrium - no source found either way.

  - key: h2_approach
    assumed: [0.3, 0.9]
    supported: null
    conditions: "approach to H2S/H2 equilibrium in a packed or fluidised bed"
    basis: not-found
    sources: ["10.2355/isijinternational.44.250"]
    note: >
      No measurement of bed approach for this reaction was found. The consequence of the assumed
      range is however now sourced rather than assumed: with K = 3.84e-3 at 900 C, the hydrogen
      circulated per mol of sulfur removed is 1/(K*approach) = 289 mol at approach 0.9, 521 mol
      at 0.5 and 868 mol at 0.3. The brief's figure of roughly 300-1000 mol H2 per mol S is
      therefore supported by the equilibrium data for any approach in the assumed range.

  - key: new_residual_S_floor_wt
    assumed: "simulator reports <0.01 wt% S for the hydrogen route; no floor is modelled"
    supported: [0.02, 0.2]
    conditions: "porous reduced iron, 1173 K, sulfur activity below the Fe/FeS boundary"
    basis: measured
    sources: ["10.2355/isijinternational.44.250"]
    note: >
      The most consequential finding against the model. Iguchi and Itoh state the bulk solubility
      limit of sulfur in reduced iron is 0.020 +/- 0.002 mass% at 1173 K, and that this is only
      10 percent of the saturated sorption content of 0.2 mass% they measure at the same
      temperature - the other 90 percent sits on pore surfaces and on grain boundaries, and is
      described by a Langmuir isotherm. The equilibrium sorption content tracks BET specific
      surface area (their Fig. 7, not digitised here). Two separate consequences:
      (i) sulfur at 0.02 mass% remains dissolved in the metal whenever FeS is still present, so
      the gas must be held below the Fe/FeS boundary - roughly aS <= 0.5, pH2S/pH2 <= 1.9e-3 at
      900 C - before 0.01 wt% is even thermodynamically available;
      (ii) the measured 0.2 mass% plateau is for high-surface-area porous iron from iron ore. Our
      concentrate is dense 60-250 um metal grains with a far smaller specific surface area, so
      the surface and grain-boundary term should be much smaller - but that scaling is an
      inference from their own surface-area correlation, not a measurement on dense grains, and
      it is the single number a bench test should settle first.

  - key: new_S_reabsorption_on_cooling
    assumed: "not modelled"
    supported: "yes, and fast"
    conditions: "reduced iron in H2-H2S at 873-1173 K, H2S from several hundred to several thousand ppm"
    basis: measured
    sources: ["10.2355/isijinternational.44.250"]
    method: "sorption is rapid above 873 K even at these H2S levels; rate is controlled by surface diffusion of adsorbed sulfur at 873 K, shifting towards pore diffusion as temperature rises"
    note: >
      Answers the brief's question directly: yes, the product re-absorbs sulfur from H2S, the
      uptake is an equilibrium set by pH2S/pH2 rather than a one-way reaction, and it is fast.
      The practical implication is that the cold trap and the cooling path are part of the
      sulfur specification, not an afterthought - cooling the product in gas that has not been
      cleaned will put sulfur back on it.

  - key: new_reverse_rate
    assumed: "not modelled"
    supported: "k = 211 * exp(-5500/RT) (cal/mol units, as published); Ea = 5.5 kcal/mol = 23 kJ/mol"
    conditions: "sintered reduced iron, 457-704 C, 0-0.52 vol% H2S in 75 vol% H2, particle radius 0.09-0.5 mm"
    basis: analogue
    sources: ["10.1252/jcej.14.389"]
    note: >
      The reverse reaction, iron sulfurised by H2S, measured on particles of the size we would
      grind to. Two transferable results. First, the intrinsic surface reaction is fast and its
      activation energy is low, 23 kJ/mol, so the observed rate is set by pore diffusion rather
      than by chemistry - Kimura et al. had to strip a diffusion limitation out of their data to
      recover the intrinsic constant. Second, sulfurisation closes the solid's porosity because
      FeS occupies more volume than Fe. Running the same reaction backwards reverses that sign:
      stripping sulfur from troilite should open porosity rather than seal it, which argues
      against the product-layer-stalls failure mode the brief worried about. Both statements are
      inferences by reversal from a measurement in the opposite direction, not measurements of
      our reaction, and the temperature range is below ours.

  - key: new_FeO_side_reaction
    assumed: "not modelled"
    supported: "minor but non-zero reduction of pyroxene and olivine"
    conditions: "Apollo soils, lunar meteorite and simulant, 1000 C, 4 h, ~420 mbar H2, static system"
    basis: analogue
    sources: ["10.1016/j.pss.2021.105287"]
    note: >
      Sargeant et al. report that all samples reduced to some extent and that, alongside
      ilmenite, pyroxene and olivine also showed some minor reduction, the mare soil yielding
      0.94 wt% O2. So hydrogen does attack silicate FeO at 1000 C on a 4 h timescale, turning
      hydrogen into water. This is an upper-bound analogue, not our case: lunar soil is finer,
      more ilmenite-rich and space-weathered compared with a magnetically cleaned chondrite
      concentrate, and 1000 C is above our 950 C ceiling. No rate constant is available, and the
      water produced is an additional load on the same cold trap as the H2S.

  - key: new_sintering_of_the_bed
    assumed: "not modelled"
    supported: "observed at 973 K on porous reduced iron"
    conditions: "reduced iron particles held in H2-H2S, 973 K"
    basis: analogue
    sources: ["10.2355/isijinternational.44.250", "10.1252/jcej.14.389"]
    note: >
      Iguchi and Itoh attribute a loss of weight gain at 973 K partly to sintering of their
      particles, and record that specific surface area falls as reduction temperature rises.
      This is sintering of fine porous reduced iron, far more sinter-prone than dense 60-250 um
      metal grains, so it bounds rather than predicts our case. No source was found for what
      practitioners do about it over 24-96 h holds; fluidised beds, rotary kilns and vibration
      were searched for and nothing specific to this duty came back.

  - key: new_conversion_ceiling
    assumed: "simulator assumes shrinking-core conversion can approach completion"
    supported: null
    conditions: "wanted: fractional conversion of troilite plateau in H2 at 900 C"
    basis: not-found
    sources: []
    note: >
      Nothing was found on whether FeS desulfurisation in H2 stalls short of completion. The
      brief flags a ceiling below about 97 percent as decisive. It remains unknown.

  - key: new_phosphorus_fate
    assumed: "not modelled; no product phosphorus limit exists"
    supported: null
    conditions: "wanted: fate of schreibersite, carbides, chromite and daubreelite in H2 at 800-950 C"
    basis: not-found
    sources: []
    note: >
      Searched and not found. No source was obtained on phosphide, carbide or chromite behaviour
      under these conditions, so the product phosphorus content is unconstrained.

  # ---------------- Priority 2: the feed ----------------

  - key: metal_d50_um
    assumed: [80, 400]
    supported: null
    conditions: "wanted: metal grain size distributions in H, L and LL chondrites by petrologic type"
    basis: not-found
    sources: ["10.1029/2002gl016672", "10.1111/j.1945-5100.2008.tb01120.x", "10.1111/maps.12268"]
    note: >
      The relevant papers were located but their distributions sit in figures and tables behind
      paywalls that could not be opened. Schneider et al. measured metal size distributions for
      three EL3 and three EH3 chondrites and found EL grains systematically larger than EH, but
      no numbers are released in the abstract, and enstatite chondrites are not the H/L/LL feed
      the simulator uses. Kimura et al. establish that in type 3 ordinary and CO chondrites metal
      sits inside chondrules, on chondrule surfaces and as isolated matrix grains, which means a
      single d50 is a poor description of the feed whatever its value - the distribution is at
      least bimodal by occurrence. Since the simulator's pass rate falls from 1.00 at 60 um to
      0.18 at 250 um, this gap matters as much as tau_h2_h.

  - key: locked_fes
    assumed: [0.08, 0.45]
    supported: null
    conditions: "wanted: fraction of troilite intergrown with or enclosed in metal in ordinary chondrites"
    basis: analogue
    sources: ["10.1111/j.1945-5100.2011.01244.x"]
    note: >
      Only qualitative evidence, and from the wrong class. Van Niekerk and Keil report that in
      EL3 chondrites large metal assemblages are usually intergrown with silicate and that
      sulfides are also sometimes intergrown with silicate. That is consistent with a
      substantial locked fraction but supports no number, and EL textures are attributed there
      to impact melting, so they do not transfer to ordinary chondrites. The brief's own
      judgement that enclosed sulfide is the most likely hidden failure is neither confirmed nor
      refuted by anything found.

  - key: locked_sil
    assumed: [0.004, 0.03]
    supported: null
    conditions: "wanted: silicate carried into a magnetic concentrate at coarse grind"
    basis: not-found
    sources: ["NTRS-19930007697"]
    note: "See mag_recovery."

  - key: mag_recovery
    assumed: [0.88, 0.98]
    supported: null
    conditions: "wanted: metal recovery of magnetic separation on crushed chondrite against grind size"
    basis: not-found
    sources: ["NTRS-19930007697"]
    note: >
      No magnetic-separation test on crushed chondrite or meteorite simulant was found. The NASA
      Space Resources beneficiation chapter is a research-needs document that recommends such
      bench experiments be performed rather than reporting them, which is positive evidence that
      the data did not exist rather than evidence that the search missed it.

  - key: bond_wi
    assumed: [12, 20]
    supported: null
    conditions: "wanted: Bond work index or comminution energy of chondritic material"
    basis: not-found
    sources: []
    note: >
      Nothing found. Meteorite mechanical-property literature is about strength, porosity and
      density rather than grinding energy; no comminution test on chondritic material surfaced.

  - key: new_feed_composition
    assumed: "FEEDS dict: H metal 0.15-0.19, troilite 0.050-0.060; L 0.06-0.09 / 0.055-0.065; LL 0.02-0.04 / 0.050-0.060; EH 0.20-0.28 / 0.07-0.12"
    supported: null
    conditions: "wanted: bulk metal, troilite and FeO by class with spread"
    basis: not-found
    sources: ["10.1111/j.1945-5100.2006.tb00528.x", "10.1111/maps.12268"]
    note: >
      The standard compilation is Jarosewich's Smithsonian analyses, confirmed as a record but
      not opened, so no numbers are taken from it. Gattacceca et al. independently report that
      bulk metal content of ordinary chondrites falls with increasing petrologic type, which the
      simulator's class-only feed definition does not represent.

  # ---------------- Priority 3: the alternatives ----------------

  - key: wetting_cos
    assumed: [0.6, 1.0]
    supported: "dihedral angle 30-48 degrees, below the 60 degree percolation threshold"
    conditions: "solid Fe with liquid Fe-S, 0.5-3.0 GPa, held to steady state after about 2 h"
    basis: extrapolated
    sources: ["10.1111/maps.14149", "10.1038/s41467-025-58517-8"]
    note: >
      Matsubara et al. measure dihedral angles of 30-48 degrees between solid iron and Fe-S
      melt, decreasing with pressure, all below the 60 degree threshold, and conclude the melt
      forms interconnected networks with a fraction remaining as trapped melt. Two caveats: a
      dihedral angle is not the simulator's contact-angle cosine - they are related through the
      ratio of solid-solid to solid-liquid interfacial energy, and no conversion is attempted
      here - and the measurements are at 0.5-3.0 GPa, whereas a centrifuge crucible operates
      near zero pressure. The direction of the result is nevertheless unambiguous and matches
      the simulator's conclusion: Fe-S liquid wets solid iron grain boundaries, so draining it
      leaves trapped melt behind. Capillary hold-up defeating liquation is now supported by
      measurement rather than by the model alone.

  - key: gamma_sulfide
    assumed: [0.35, 0.9]
    supported: null
    conditions: "wanted: surface tension of Fe-S liquid, N/m"
    basis: not-found
    sources: []
    note: "Searched alongside the wetting work; no surface-tension measurement for Fe-S liquids was obtained."

  - key: tau_carb_h
    assumed: [15, 300]
    supported: null
    conditions: "wanted: Fe carbonylation time constant on meteoritic or Fe-Ni alloy feed, 100 bar CO, 175 C"
    basis: not-found
    sources: []
    note: >
      No carbonylation rate measured on meteoritic or Fe-Ni alloy feed was found, and nothing on
      sulfur as catalyst or poison for it, on passivation, or on any demonstration using real
      meteorite. The searches returned iron pentacarbonyl as a CVD and nanoparticle precursor
      instead. carb_cap and co_loss are equally unsupported.

  - key: carb_cap
    assumed: [0.80, 0.97]
    supported: null
    conditions: "wanted: maximum Fe extraction before passivation"
    basis: not-found
    sources: []
    note: "See tau_carb_h."

  - key: co_loss
    assumed: [0.002, 0.03]
    supported: null
    conditions: "wanted: CO lost per unit bound to product"
    basis: not-found
    sources: []
    note: "See tau_carb_h."

  - key: ls_native
    assumed: [0.3, 5.0]
    supported: null
    conditions: "S partition slag/metal, FeO-bearing chondritic slag"
    basis: not-assessed
    sources: []
    note: "Not reached this round. Priority 3 melt-with-slag parameters were deferred per the brief's stop rule."

  - key: ls_flux
    assumed: [20, 200]
    supported: null
    conditions: "S partition with CaO-rich reducing slag"
    basis: not-assessed
    sources: []
    note: "Not reached this round."

  - key: mu_sil_1600
    assumed: [0.3, 5.0]
    supported: null
    conditions: "silicate melt viscosity at 1600 C, Pa.s"
    basis: not-assessed
    sources: []
    note: "Not reached this round."

  - key: k_vac_S
    assumed: [5.0e-7, 1.0e-5]
    supported: null
    conditions: "vacuum S evaporation rate constant, m/s"
    basis: not-assessed
    sources: []
    note: "Not reached this round."

  - key: incl_d50_um
    assumed: [15, 120]
    supported: null
    conditions: "silicate inclusion / metal droplet size in the melt"
    basis: not-assessed
    sources: []
    note: "Not reached this round."
