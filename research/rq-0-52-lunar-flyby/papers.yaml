# Sources for rq-0-52: how much Earth-relative excess speed a lunar flyby gives or absorbs
# Compiled: 2026-11-13.
# access: full-text     = PDF or full HTML opened and read in this session
#         abstract-only = abstract retrieved, full text not read
# Nothing in this file is cited from a reference list alone.

papers:
  - id: "10.1007/s42064-023-0161-9"
    alt_id: "arXiv:2302.12144"
    title: "Capacity of Sun-driven lunar swingby sequences and their application in asteroid retrieval"
    authors: ["Hongru Chen"]
    year: 2023
    venue: "Astrodynamics 7 (2023)"
    relevance: critical
    access: full-text
    summary: "Bounds what sequences of lunar swingbys joined by Sun-perturbed Moon-to-Moon transfers can give or absorb, for escape and for capture alike. Planar sequences reach an Earth-relative excess speed of 1.46 km/s (C3 2.13 km2/s2) in all directions, 1.8 km/s at best, and 2.2 km/s with an added Earth-passing transfer; each Moon-to-Moon transfer is limited to 200 days, at most two are chained, and minimum lunar flyby altitude is 100 km."

  - id: "hdl:2324/4371999"
    title: "Earth Escape from a Sun-Earth Halo Orbit using Unstable Manifold and Lunar Swingbys"
    authors: ["Hongru Chen", "Yasuhiro Kawakatsu", "Toshiya Hanada"]
    year: 2016
    venue: "Transactions of the Japan Society for Aeronautical and Space Sciences 59(5), 269-277"
    relevance: critical
    access: full-text
    summary: "The closest published case to a tug leaving a Sun-Earth libration-point node: coast along the halo orbit's unstable manifold to the Moon, then escape by swingby. One swingby gives C3 up to 2.6 km2/s2 for two of the four encounter geometries and 0.5 km2/s2 or no escape for the other two; a second swingby after 75-95 days raises those to about 2.7 km2/s2. Theoretical ceilings are 2.3 (short sequences), 3.3 (double) and 5 km2/s2 (multiple). Assumes the halo orbit is already phased for the lunar encounter and leaves the phasing cost to later work."

  - id: "AAS 13-409"
    url: "https://kiss.resources.caltech.edu/uploads/2026/09/papers-getanea-2-4-13.pdf"
    title: "Trajectories to Nab a NEA (Near-Earth Asteroid)"
    authors: ["Damon Landau", "John Dankanich", "Nathan Strange", "Julie Bellerose", "Pedro Llanos", "Marco Tantardini"]
    year: 2013
    venue: "AAS/AIAA Space Flight Mechanics Meeting, paper AAS 13-409"
    relevance: critical
    access: full-text
    summary: "Trajectory design behind the Keck asteroid-retrieval study; the capture case, with return masses up to 1,000 t and more. Takes the Moon to capture objects arriving with C3 up to 2 km2/s2 (1.41 km/s) down to about -0.5 km2/s2, from declinations up to 30 degrees from the ecliptic, with higher energies only for in-plane arrivals at a favourable lunar phase. The returned mass then goes by way of a Sun-Earth L1 or L2 region to its storage orbit."

  - id: "ISSFD-2017-023"
    url: "https://issfd.org/ISSFD_2017/paper/ISTS-2017-d-023__ISSFD-2017-023.pdf"
    title: "Design of High-Energy Escape Trajectories with Lunar Gravity Assist"
    authors: ["Lorenzo Casalino", "Lucio Filizola"]
    year: 2017
    venue: "ISTS-2017-d-023 / ISSFD-2017-023"
    relevance: high
    access: full-text
    summary: "Optimises a single lunar flyby from launch for an electric-propulsion mission to a near-Earth asteroid, and verifies it numerically. Escape speeds of 1.2, 1.3 and 1.4 km/s are reached from launch energies of -1.3 to -0.8 km2/s2, with the flyby 160-250 km above the lunar surface and about ten days from the start of the escape sequence to escape. Flyby opportunities depend on the escape date and direction."

  - id: "NTRS 20140002055"
    url: "https://ntrs.nasa.gov/citations/20140002055"
    title: "Using Gravity Assists in the Earth-Moon System as a Gateway to the Solar System"
    authors: ["Tim McElrath", "Gregory Lantoine", "Damon Landau", "Dan Grebow", "Nathan Strange", "Roby Wilson", "Jon Sims"]
    year: 2012
    venue: "Global Space Exploration Conference, Washington DC, May 2012"
    relevance: high
    access: abstract-only
    summary: "Abstract states that lunar flybys give a C3 of about 2 km2/s2 within about two months and about 4.5 km2/s2 over four to six months without propulsion, and that a burn at Earth periapsis can raise 2-3 to 10 or more. Chen et al. 2016 report from its body a maximum of 3.25 km2/s2 for double swingbys within 200 days and 4.7 km2/s2 for triple swingbys."

  # ---------------- Scout launch trade (added 2026-11-15) ----------------

  - id: "wikipedia:ESCAPADE"
    url: "https://en.wikipedia.org/wiki/ESCAPADE"
    title: "ESCAPADE (Escape and Plasma Acceleration and Dynamics Explorers)"
    authors: ["Wikipedia contributors"]
    year: 2026
    venue: "Wikipedia, read 2026-11-15; trajectory cross-checked against NASA SVS 14915"
    relevance: high
    access: full-text
    summary: "Two 535 kg (wet) spacecraft, the size of a scout, launched together on a New Glenn in November 2025 under a launch contract of about 20 million dollars. They were first a ride-along on Psyche and lost that ride when Psyche moved to a different launcher and trajectory. They waited a year near Sun-Earth L2 and left for Mars with a powered Earth flyby in November 2026."

  - id: "NASA-SVS-14915"
    url: "https://svs.gsfc.nasa.gov/14915"
    title: "ESCAPADE Trajectory Animations"
    authors: ["NASA Scientific Visualization Studio"]
    year: 2025
    venue: "NASA Goddard"
    relevance: medium
    access: full-text
    summary: "Describes the loiter orbit about Sun-Earth L2 and the powered Earth flyby (a burn of about nine minutes) a year after launch. States the purpose: the launch date no longer has to match the planetary window."

  - id: "NASA-Janus-2022-11-18"
    url: "https://science.nasa.gov/blogs/janus/2022/11/18/janus-mission-removed-from-2023-psyche-launch-manifest/"
    title: "Janus Mission Removed from 2023 Psyche Launch Manifest"
    authors: ["NASA"]
    year: 2022
    venue: "NASA Science blog"
    relevance: high
    access: full-text
    summary: "Two small asteroid spacecraft riding with Psyche were removed when the main mission's launch date moved, because the new date left them unable to reach their asteroids. The case for what a ride-along gives up: the day and direction of departure belong to the main passenger."

  - id: "wikipedia:ESPA"
    url: "https://en.wikipedia.org/wiki/EELV_Secondary_Payload_Adapter"
    title: "EELV Secondary Payload Adapter"
    authors: ["Wikipedia contributors"]
    year: 2026
    venue: "Wikipedia, read 2026-11-15"
    relevance: medium
    access: full-text
    summary: "Port limits for ride-along payloads: 180 kg on a standard port, 320 kg on an ESPA Grande port, and up to 700 kg on Moog's ESPA Grande. A provider's own user guide was not obtained."

  - id: "wikipedia:Falcon-9-Block-5"
    url: "https://en.wikipedia.org/wiki/Falcon_9_Block_5"
    title: "Falcon 9 Block 5"
    authors: ["Wikipedia contributors"]
    year: 2026
    venue: "Wikipedia, read 2026-11-15"
    relevance: medium
    access: full-text
    summary: "Payload 22.8 t to low orbit and 8.3 t to geostationary transfer with the first stage expended, 5.5 t to geostationary transfer with it recovered, 4.0 t to Mars. Second stage 4.0 t empty and 111.5 t gross. Used as anchors for the launcher estimate; the second-stage specific impulse (348 s) is the provider's published figure and was not re-read in this session."

  - id: "keeptrack:falcon-9-cost"
    url: "https://keeptrack.space/deep-dive/how-much-does-a-falcon-9-launch-cost"
    title: "How much does a Falcon 9 launch cost"
    authors: ["KeepTrack"]
    year: 2026
    venue: "web article, search summary only"
    relevance: low
    access: abstract-only
    summary: "List price 70 million dollars in 2025 and 74 million in 2026; NASA science launches from about 69 million (COSI) to about 100 million (NEO Surveyor) including mission services. Secondary source, read as a search summary."

  - id: "10.2322/stj.4.43"
    url: "https://www.jstage.jst.go.jp/article/stj/4/0/4_0_43/_article/-char/en"
    title: "Escape Trajectory and Connection to Interplanetary Voyage from the Sun-Earth L2 Point"
    authors: ["Michihiro Matsumoto", "Jun'ichiro Kawaguchi"]
    year: 2005
    venue: "Space Technology Japan 4, 43-52"
    relevance: medium
    access: abstract-only
    summary: "Escape from a Sun-Earth libration point followed by a loop under electric thrust and an Earth flyby (the technique flown by Hayabusa). The abstract gives no figures for the gain per unit of thruster velocity change."

