    priority: medium
  - id: option-keeping-spend
    topic: Scope and cap of spend to keep the 0B option alive after deferral
    positions:
      - statement: >-
          Permitted list (data curation, licences, ≤5 FTE core team, remote-survey purchase, re-tests, TRL≤5 ground work
          already contracted); no flight hardware, long-lead, pathfinder or contracts past S; owner-set cap at KDP-0A as
          a low single-digit percentage of the 0A run rate, acting as a second sunset trigger; lower cap after S
        models:
          - Claude Opus 5.5
        evidence: time and spend drift both need catching; cap to be justified by a restart-cost estimate (low certainty)
      - statement: >-
          Separately identified, evidence-producing budget before sunset; no evergreen allowance; any preservation
          justified item by item (data, samples, software, storage, time-limited personnel) under an absolute cap in a
          new decision; no tooling or long-lead production disguised as preservation
        models:
          - GPT-6.1 Sol
        evidence: weakest evidential link is the economic value of keeping the option alive (very low certainty)
    resolution_status: partially-resolved
    priority: high
