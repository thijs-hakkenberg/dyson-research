questionId: rq-0-69
topics:
  - id: sunset-default-execution
    topic: Whether M180 executes the fallback by default without further decision
    positions:
      - statement: >-
          M180 is a ceiling granting no authority; if KDP-0B is not passed by S the fallback executes by default (stop
          0B spend except closure, Earth-supply baseline subject to Phase 1 gates, 0A completes)
        models:
          - Claude Opus 5.5
        evidence: >-
          D-02 reversibility logic puts burden of proof on continuation; escalation-of-commitment (Staw 1976; Arkes &
          Blumer 1985) and status-quo bias (Samuelson & Zeckhauser 1988) literature; null and planning-boundary options
          fail the must-criterion of bounding every §6 slip
      - statement: >-
          Existing 0B development authority expires automatically at M180; "0A only, Earth supply" becomes the planning
          baseline by default; inaction cannot extend funding
        models:
          - GPT-6.1 Sol
        evidence: >-
          a real option requires a controlled cost of waiting; a decision point alone leaves unresolved what happens
          without a decision; weighted QOC (85.0 against 63.8 hard fallback and 70.0 decision point only)
      - statement: M180 is a hard sunset that automatically triggers the fallback
        models:
          - Gemini 3.1 Pro
        evidence: >-
          megaprojects resist cancellation once capital is deployed; 180 months judged ample margin (asserted >90%
          likelihood from Apollo/ISS analogues, which peers called uncalibrated)
    resolution_status: resolved
    priority: critical
  - id: continuation-before-expiry
    topic: Whether bounded continuation can be authorised in place before S or only by re-entry after S
    positions:
      - statement: >-
          In-place extension of S is not available; 0B may be reopened only after S by a new owner decision record
          showing g-target, g-demand and g-economics passed, meeting KDP-0B criteria, priced as a new commitment
        models:
          - Claude Opus 5.5
        evidence: >-
          re-entry is a door that can be abused and must be made expensive; ACH shows only the near-ready-but-late
          hypothesis justifies continuation, and it predicts the other gates have passed
      - statement: >-
          A new owner decision effective before expiry may authorise a bounded corrective or preservation programme with
          scope, absolute cap, expiry, deliverables and stop conditions; it cannot constitute or waive KDP-0B
        models:
          - GPT-6.1 Sol
        evidence: >-
          preserves accountable choice when circumstances change; capability can be expensive to reconstruct; Claude's
          vote called this slightly looser but bounded and explicit
    resolution_status: open
    priority: critical
  - id: fallback-reversibility
    topic: What the fallback commits to and whether it is reversible
    positions:
      - statement: >-
          The fallback is reversible; it switches the Phase 1 supply baseline to Earth subject to Phase 1's own gates
          and commits nothing irreversible; if contract analysis shows otherwise, the fallback needs its own D-02
          treatment and automatic execution is wrong
        models:
          - Claude Opus 5.5
        evidence: restart cost, not irrevocable commitment, is the cost of undoing; assumption K2 with a stated falsifier
      - statement: >-
          Expiry adopts Earth supply as a planning baseline only and does not authorise a long-term Earth-supply
          purchase
        models:
          - GPT-6.1 Sol
        evidence: >-
          D-01's demand-sized approach and the separation of supply strategy from purchasing authority (moderate
          certainty, high confidence in the distinction)
      - statement: >-
          The fallback is a highly irreversible one-way door committing the programme to a fifteen-year Earth-supply
          paradigm
        models:
          - Gemini 3.1 Pro
        evidence: >-
          frame statement only; Claude and GPT both flagged it as conflicting with D-02 and conflating fallback with
          procurement
    resolution_status: partially-resolved
    priority: high
  - id: kdp-0b-planning-buffer
