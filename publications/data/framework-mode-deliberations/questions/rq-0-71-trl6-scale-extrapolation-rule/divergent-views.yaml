          Apply numerical runtime, degradation-validation and equivalent-life requirements separately from power and
          throughput.
        models:
          - Claude Opus 5.5
        evidence: >-
          Claude invoked physics-of-failure and long-duration testing experience, but identified its specific numerical
          defaults as low confidence.
      - statement: Cap duration extrapolation at 10×, requiring at least 10% physical design-life testing.
        models:
          - Gemini 3.1 Pro
        evidence: >-
          Gemini asserted a universal empirical runtime need; Claude and GPT rejected the claimed certainty as
          unsupported.
      - statement: Require validated degradation mechanisms and acceleration relationships without a universal runtime fraction.
        models:
          - GPT-6.1 Sol
        evidence: >-
          GPT argued that different damage modes require different tests and that a single hours multiplier is
          insufficient.
    resolution_status: open
    priority: critical
