topics:
  - id: power-throughput-limits
    topic: Universal limits on single-unit power and throughput extrapolation
    positions:
      - statement: >-
          Use a 10× default, permit 10–100× with a pre-registered regime case and intermediate anchor, and prohibit
          acceptance above 100×.
        models:
          - Claude Opus 5.5
        evidence: >-
          Claude cited regime-change risk and protection against optimistic review, while acknowledging low confidence
          in the numerical thresholds.
      - statement: Set no fixed limit when governing regimes match.
        models:
          - Gemini 3.1 Pro
        evidence: >-
          Gemini relied on dimensionless regime matching and pathfinder affordability; Claude and GPT challenged the
          sufficiency of regime matching alone.
      - statement: Use no universal ratio; limit acceptance to an independently reviewed, test-supported deployment envelope.
        models:
          - GPT-6.1 Sol
        evidence: >-
          GPT cited threshold-dependent failures, differences among technologies, and validated predictive reach rather
          than aggregate scale ratios.
    resolution_status: open
    priority: critical
  - id: duration-and-wear
    topic: Minimum runtime and lifetime extrapolation requirements
